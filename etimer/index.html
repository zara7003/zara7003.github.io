<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice & Visual Workout Interval Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Overscan safety for Smart TVs */
    .tv-wrapper {
      width: 100vw;
      height: 100vh;
      padding: clamp(8px, 2vh, 20px) clamp(12px, 3vw, 32px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      max-width: 95vw;
      max-height: 95vh;
      background: #1e293b;
      padding: clamp(10px, 1.8vh, 20px);
      border-radius: clamp(12px, 2vw, 24px);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .settings-toggle-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: clamp(6px, 1vh, 10px) clamp(12px, 1.5vw, 18px);
      border-radius: 8px;
      font-size: clamp(0.85rem, 1.8vh, 1.1rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .settings-toggle-btn:focus {
      outline: 4px solid #38bdf8;
      outline-offset: 2px;
    }

    h1 {
      font-size: clamp(1rem, 2.5vh, 1.8rem);
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0;
    }
    
    .status-badge {
      display: inline-block;
      padding: clamp(4px, 0.8vh, 8px) clamp(16px, 2.5vw, 32px);
      border-radius: 9999px;
      font-weight: 800;
      font-size: clamp(1.1rem, 3.2vh, 2.4rem);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .status-work { background-color: #10b981; color: #022c22; }
    .status-setbreak { background-color: #f59e0b; color: #451a03; }
    .status-exbreak { background-color: #3b82f6; color: #1e3a8a; }
    .status-prep { background-color: #8b5cf6; color: #2e1065; }
    .status-idle { background-color: #475569; color: #f8fafc; }
    
    .exercise-title {
      font-size: clamp(1.4rem, 3.8vh, 2.8rem);
      font-weight: 800;
      color: #38bdf8;
      min-height: 1.2em;
      flex-shrink: 0;
    }

    .media-card {
      width: 100%;
      flex: 1;
      min-height: 90px;
      max-height: 30vh;
      background: #0f172a;
      border-radius: 16px;
      margin: 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px dashed #334155;
      position: relative;
    }

    .media-card img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .media-placeholder { color: #64748b; font-size: clamp(0.85rem, 2vh, 1.2rem); font-weight: 600; padding: 10px; }

    .timer-display {
      font-size: clamp(3.5rem, 14vh, 9.5rem);
      font-weight: 900;
      margin: 0;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      flex-shrink: 0;
    }

    .info-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: clamp(0.95rem, 2.2vh, 1.5rem);
      color: #cbd5e1;
      font-weight: 600;
      background: #0f172a;
      padding: clamp(6px, 1.2vh, 12px);
      border-radius: 12px;
      flex-shrink: 0;
    }
    
    .controls {
      width: 100%;
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 4px;
      flex-shrink: 0;
    }

    button {
      flex: 1;
      padding: clamp(10px, 1.8vh, 18px) 20px;
      font-size: clamp(1rem, 2.2vh, 1.4rem);
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:focus { outline: 4px solid #38bdf8; outline-offset: 2px; }

    .btn-start { background-color: #10b981; color: #022c22; }
    .btn-pause { background-color: #ef4444; color: #450a0a; }
    .btn-reset { background-color: #475569; color: #f8fafc; }
    
    /* Overlay Settings Panel */
    .settings-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.96);
      border-radius: clamp(12px, 2vw, 24px);
      padding: 20px;
      z-index: 100;
      flex-direction: column;
      overflow-y: auto;
      text-align: left;
    }

    .settings-modal.active {
      display: flex;
    }

    .settings-modal h3 {
      font-size: 1.2rem;
      color: #38bdf8;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-group label { font-size: 0.85rem; color: #cbd5e1; }
    .input-group input, .input-group select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; text-align: center; }
    .input-group input:focus, .input-group select:focus { outline: 2px solid #38bdf8; }
    
    .ex-list-header { font-size: 0.95rem; color: #94a3b8; text-transform: uppercase; margin: 12px 0 8px; font-weight: 700; }
    .ex-custom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .ex-custom-row input { padding: 6px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 0.85rem; }

    .close-settings-btn {
      align-self: flex-end;
      background: #10b981;
      color: #022c22;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 700;
      margin-bottom: 12px;
      flex-grow: 0;
    }
  </style>
</head>
<body>

  <!-- Background Music Audio Element -->
  <audio id="bgMusic" loop preload="none">
    <source id="musicSource" src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
  </audio>

  <div class="tv-wrapper">
    <div class="container">
      
      <div class="top-bar">
        <button class="settings-toggle-btn" onclick="toggleSettingsModal()">⚙️ Settings</button>
        <h1>Workout Timer</h1>
        <div style="width: 80px;"></div>
      </div>

      <div id="statusBadge" class="status-badge status-idle">Ready</div>
      <div id="exerciseTitle" class="exercise-title">Cobra Position</div>
      
      <div class="media-card">
        <img id="exerciseImg" src="" alt="Exercise Visual">
        <div id="mediaPlaceholder" class="media-placeholder">📷 Add Image URL in Settings</div>
      </div>

      <div id="timerDisplay" class="timer-display">10</div>
      
      <div class="info-row">
        <span id="setInfo">Set: 1 / 10</span>
        <span id="exInfo">Exercise: 1 / 10</span>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn-start" autofocus onclick="toggleTimer()">Start</button>
        <button class="btn-reset" onclick="resetTimer()">Reset</button>
      </div>

      <!-- Settings Panel Modal -->
      <div id="settingsModal" class="settings-modal">
        <button class="close-settings-btn" onclick="toggleSettingsModal()">Done</button>
        <h3>Timer Timings & Config</h3>
        <div class="grid-inputs">
          <div class="input-group">
            <label>Prep Time (sec):</label>
            <input type="number" id="prepInput" value="10" min="1" onchange="updateSettings()">
          </div>
          <div class="input-group">
            <label>Work Time (sec):</label>
            <input type="number" id="workInput" value="5" min="1" onchange="updateSettings()">
          </div>
          <div class="input-group">
            <label>Set Break (sec):</label>
            <input type="number" id="setBreakInput" value="5" min="0" onchange="updateSettings()">
          </div>
          <div class="input-group">
            <label>Exercise Break (sec):</label>
            <input type="number" id="exBreakInput" value="15" min="0" onchange="updateSettings()">
          </div>
          <div class="input-group">
            <label>Sets / Exercise:</label>
            <input type="number" id="setsInput" value="10" min="1" onchange="updateSettings()">
          </div>
          <div class="input-group">
            <label>Total Exercises:</label>
            <input type="number" id="exInput" value="10" min="1" onchange="renderExerciseInputs()">
          </div>
          <div class="input-group">
            <label>Voice Cues (Speech):</label>
            <select id="voiceCuesSelect" onchange="updateSettings()">
              <option value="yes" selected>Yes (Enabled)</option>
              <option value="no">No (Beeps Only)</option>
            </select>
          </div>
          <div class="input-group">
            <label>Background Radio:</label>
            <select id="radioToggleSelect" onchange="updateSettings()">
              <option value="yes" selected>Yes (On)</option>
              <option value="no">No (Off)</option>
            </select>
          </div>
          <div class="input-group">
            <label>Radio Channel:</label>
            <select id="radioChannelSelect" onchange="updateSettings()">
              <option value="https://stream.zeno.fm/f3wvbbqmdg8uv" selected>Upbeat Fitness & Workout</option>
              <option value="https://ice1.somafm.com/u80s-128-mp3">Synthwave Energy Radio</option>
              <option value="https://ice1.somafm.com/groovesalad-128-mp3">Chill Lo-Fi / Groove Salad</option>
            </select>
          </div>
          <div class="input-group">
            <label>Radio Play Time:</label>
            <select id="radioModeSelect" onchange="updateSettings()">
              <option value="always" selected>Play Always (Workout + Breaks)</option>
              <option value="work_only">Play During Work Intervals Only</option>
              <option value="break_only">Play During Breaks Only</option>
            </select>
          </div>
        </div>

        <div class="ex-list-header">Customize Exercise Names & Images</div>
        <div id="exerciseInputsContainer"></div>
      </div>

    </div>
  </div>

  <script>
    let prepSec = 10;
    let workSec = 5;
    let setBreakSec = 5;
    let exBreakSec = 15;
    let setsPerEx = 10;
    let totalEx = 10;
    let voiceCuesEnabled = true;
    let radioEnabled = true;
    let radioMode = 'always'; // 'always', 'work_only', 'break_only'

    let exerciseList = [
      { name: "Cobra Position", img: "" },
      { name: "Hamstring Stretch", img: "" },
      { name: "Child Pose", img: "" },
      { name: "Glute Bridge", img: "" },
      { name: "Plank Hold", img: "" },
      { name: "Quad Stretch", img: "" },
      { name: "Cat Cow Stretch", img: "" },
      { name: "Calf Stretch", img: "" },
      { name: "Side Plank Left", img: "" },
      { name: "Side Plank Right", img: "" }
    ];

    let currentPhase = 'PREP'; // 'PREP', 'WORK', 'SET_BREAK', 'EX_BREAK'
    let currentSet = 1;
    let currentEx = 1;
    let timeLeft = prepSec;
    let isRunning = false;
    let timerId = null;

    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) {
          audioCtx = new AudioCtxClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Synthesized Web Audio Chimes & Cues
    function playBeep(freq, type, duration, delay = 0) {
      initAudioContext();
      if (!audioCtx) return;

      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type; 
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }, delay);
    }

    function playCueSound(cueType) {
      if (cueType === 'start') {
        playBeep(880, 'triangle', 0.15, 0);
        playBeep(1174.66, 'triangle', 0.2, 120);
      } else if (cueType === 'rest') {
        playBeep(440, 'sine', 0.2, 0);
        playBeep(330, 'sine', 0.25, 150);
      } else if (cueType === 'position') {
        playBeep(523.25, 'sine', 0.15, 0);
        playBeep(659.25, 'sine', 0.2, 120);
      } else if (cueType === 'prepare') {
        playBeep(587.33, 'sine', 0.2, 0);
        playBeep(440, 'sine', 0.25, 150);
      } else if (cueType === 'change') {
        playBeep(523.25, 'triangle', 0.15, 0);
        playBeep(659.25, 'triangle', 0.15, 150);
        playBeep(783.99, 'triangle', 0.25, 300);
      } else if (cueType === 'tick') {
        playBeep(750, 'sine', 0.08, 0);
      }
    }

    function speak(text, cueType = '') {
      initAudioContext();
      if (cueType) playCueSound(cueType);

      if (voiceCuesEnabled && 'speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.1;
          utterance.volume = 1.0;
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }
    }

    function updateRadioPlaybackState() {
      const bgMusic = document.getElementById('bgMusic');
      if (!isRunning || !radioEnabled) {
        bgMusic.pause();
        return;
      }

      // Determine if radio should play based on radioMode and currentPhase
      let shouldPlay = false;
      if (radioMode === 'always') {
        shouldPlay = true;
      } else if (radioMode === 'work_only') {
        shouldPlay = (currentPhase === 'WORK');
      } else if (radioMode === 'break_only') {
        shouldPlay = (currentPhase === 'SET_BREAK' || currentPhase === 'EX_BREAK' || currentPhase === 'PREP');
      }

      if (shouldPlay) {
        bgMusic.play().catch(e => {});
      } else {
        bgMusic.pause();
      }
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settingsModal');
      modal.classList.toggle('active');
    }

    function renderExerciseInputs() {
      totalEx = parseInt(document.getElementById('exInput').value) || 10;
      const container = document.getElementById('exerciseInputsContainer');
      container.innerHTML = '';

      for (let i = 0; i < totalEx; i++) {
        if (!exerciseList[i]) {
          exerciseList[i] = { name: `Exercise ${i + 1}`, img: "" };
        }
        const row = document.createElement('div');
        row.className = 'ex-custom-row';
        row.innerHTML = `
          <input type="text" placeholder="Ex ${i+1} Name" value="${exerciseList[i].name}" onchange="updateExData(${i}, 'name', this.value)">
          <input type="text" placeholder="Image URL (optional)" value="${exerciseList[i].img}" onchange="updateExData(${i}, 'img', this.value)">
        `;
        container.appendChild(row);
      }
      updateDisplay();
    }

    function updateExData(index, field, value) {
      exerciseList[index][field] = value;
      updateDisplay();
    }

    function formatTime(seconds) {
      if (seconds < 60) return String(seconds).padStart(2, '0');
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateDisplay() {
      const statusBadge = document.getElementById('statusBadge');
      const timerDisplay = document.getElementById('timerDisplay');
      const setInfo = document.getElementById('setInfo');
      const exInfo = document.getElementById('exInfo');
      const exerciseTitle = document.getElementById('exerciseTitle');
      const exerciseImg = document.getElementById('exerciseImg');
      const mediaPlaceholder = document.getElementById('mediaPlaceholder');

      timerDisplay.innerText = formatTime(timeLeft);
      setInfo.innerText = `Set: ${currentSet} / ${setsPerEx}`;
      exInfo.innerText = `Exercise: ${currentEx} / ${totalEx}`;

      const activeEx = exerciseList[currentEx - 1] || { name: `Exercise ${currentEx}`, img: "" };
      exerciseTitle.innerText = activeEx.name;

      if (activeEx.img && activeEx.img.trim() !== "") {
        exerciseImg.src = activeEx.img;
        exerciseImg.style.display = 'block';
        mediaPlaceholder.style.display = 'none';
      } else {
        exerciseImg.style.display = 'none';
        mediaPlaceholder.style.display = 'block';
        mediaPlaceholder.innerText = `📷 Position: ${activeEx.name}`;
      }

      if (currentPhase === 'PREP') {
        statusBadge.innerText = 'PREPARE';
        statusBadge.className = 'status-badge status-prep';
      } else if (currentPhase === 'WORK') {
        statusBadge.innerText = 'WORK';
        statusBadge.className = 'status-badge status-work';
      } else if (currentPhase === 'SET_BREAK') {
        statusBadge.innerText = 'REST';
        statusBadge.className = 'status-badge status-setbreak';
      } else if (currentPhase === 'EX_BREAK') {
        statusBadge.innerText = 'CHANGE POSITION';
        statusBadge.className = 'status-badge status-exbreak';
      }

      updateRadioPlaybackState();
    }

    function toggleTimer() {
      initAudioContext();
      const startBtn = document.getElementById('startBtn');

      if (isRunning) {
        clearInterval(timerId);
        isRunning = false;
        startBtn.innerText = 'Start';
        startBtn.className = 'btn-start';
        updateRadioPlaybackState();
      } else {
        isRunning = true;
        startBtn.innerText = 'Pause';
        startBtn.className = 'btn-pause';
        
        updateRadioPlaybackState();

        if (currentPhase === 'PREP' && timeLeft === prepSec) {
          const exName = (exerciseList[0] && exerciseList[0].name) || "Exercise 1";
          speak(`Prepare. ${exName}.`, 'prepare');
        }
        timerId = setInterval(tick, 1000);
      }
    }

    function tick() {
      if (timeLeft > 1) {
        timeLeft--;
        
        if (currentPhase === 'PREP') {
          if (timeLeft === 2) speak("Position", 'position');
          else if (timeLeft <= 5 && timeLeft > 2) speak(String(timeLeft), 'tick');
        } else if (currentPhase === 'WORK') {
          if (timeLeft <= 5) speak(String(timeLeft), 'tick');
        } else if (currentPhase === 'SET_BREAK') {
          if (timeLeft === 2) speak("Position", 'position');
          else if (timeLeft <= 5 && timeLeft > 2) speak(String(timeLeft), 'tick');
        } else if (currentPhase === 'EX_BREAK') {
          if (timeLeft === 3) speak("Prepare", 'prepare');
          else if (timeLeft === 2) speak("Position", 'position');
          else if (timeLeft <= 5 && timeLeft > 3) speak(String(timeLeft), 'tick');
        }
      } else {
        if (currentPhase === 'PREP') {
          currentPhase = 'WORK';
          timeLeft = workSec;
          speak("Start", 'start');
        } else if (currentPhase === 'WORK') {
          if (currentSet < setsPerEx) {
            currentPhase = 'SET_BREAK';
            timeLeft = setBreakSec;
            speak("Rest", 'rest');
          } else {
            if (currentEx < totalEx) {
              currentPhase = 'EX_BREAK';
              timeLeft = exBreakSec;
              const nextExName = (exerciseList[currentEx] && exerciseList[currentEx].name) || `Exercise ${currentEx + 1}`;
              speak(`Set completed. Rest. Next is ${nextExName}`, 'change');
            } else {
              clearInterval(timerId);
              isRunning = false;
              document.getElementById('startBtn').innerText = 'Start';
              document.getElementById('startBtn').className = 'btn-start';
              document.getElementById('statusBadge').innerText = 'WORKOUT COMPLETE';
              document.getElementById('statusBadge').className = 'status-badge status-idle';
              updateRadioPlaybackState();
              speak("Workout complete. Great job!", 'start');
              return;
            }
          }
        } else if (currentPhase === 'SET_BREAK') {
          currentSet++;
          currentPhase = 'WORK';
          timeLeft = workSec;
          speak("Start", 'start');
        } else if (currentPhase === 'EX_BREAK') {
          currentEx++;
          currentSet = 1;
          currentPhase = 'WORK';
          timeLeft = workSec;
          const exName = (exerciseList[currentEx - 1] && exerciseList[currentEx - 1].name) || `Exercise ${currentEx}`;
          speak(`Start ${exName}`, 'start');
        }
      }
      updateDisplay();
    }

    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      const bgMusic = document.getElementById('bgMusic');
      bgMusic.pause();
      bgMusic.currentTime = 0;
      currentPhase = 'PREP';
      currentSet = 1;
      currentEx = 1;
      updateSettings();
      document.getElementById('startBtn').innerText = 'Start';
      document.getElementById('startBtn').className = 'btn-start';
      updateDisplay();
    }

    function updateSettings() {
      prepSec = parseInt(document.getElementById('prepInput').value) || 10;
      workSec = parseInt(document.getElementById('workInput').value) || 5;
      setBreakSec = parseInt(document.getElementById('setBreakInput').value) || 5;
      exBreakSec = parseInt(document.getElementById('exBreakInput').value) || 15;
      setsPerEx = parseInt(document.getElementById('setsInput').value) || 10;
      
      const voiceVal = document.getElementById('voiceCuesSelect').value;
      voiceCuesEnabled = (voiceVal === 'yes');

      const radioToggleVal = document.getElementById('radioToggleSelect').value;
      radioEnabled = (radioToggleVal === 'yes');

      radioMode = document.getElementById('radioModeSelect').value;

      const selectedChannel = document.getElementById('radioChannelSelect').value;
      const bgMusic = document.getElementById('bgMusic');
      const musicSource = document.getElementById('musicSource');
      if (musicSource.src !== selectedChannel) {
        musicSource.src = selectedChannel;
        bgMusic.load();
        if (isRunning && radioEnabled) {
          bgMusic.play().catch(e => {});
        }
      }

      updateRadioPlaybackState();

      if (!isRunning) {
        timeLeft = prepSec;
        currentPhase = 'PREP';
        updateDisplay();
      }
    }

    renderExerciseInputs();

    window.addEventListener('load', () => {
      document.getElementById('startBtn').focus();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13) {
        const activeElem = document.activeElement;
        if (activeElem && activeElem.id === 'startBtn') {
          toggleTimer();
          e.preventDefault();
        }
      }
    });
  </script>
</body>
</html>
